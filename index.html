<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConetFacility</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f4f6;color:#111827}
.oculto{display:none!important}
input,select,textarea{width:100%;padding:12px;margin:8px 0 16px;border:1px solid #ddd;border-radius:10px}
textarea{min-height:90px}
button{border:0;padding:12px 16px;border-radius:10px;font-weight:bold;cursor:pointer}
.btn-verde{background:#93D500;color:#111827}
.btn-cinza{background:#e5e7eb;color:#111827}
.btn-azul{background:#3B82F6;color:white}
.btn-vermelho{background:#ef4444;color:white}
.erro{color:#dc2626;font-weight:bold}
.sucesso{color:#15803d;font-weight:bold}
.card,.bloco{background:white;padding:25px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-bottom:20px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.login-card{max-width:620px;width:100%;background:white;border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.08);padding:42px}
.logo-login{text-align:center;margin-bottom:22px}
.logo-login img{width:220px;max-width:82%;border-radius:18px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
header{background:#323E48;color:white;padding:20px 35px;display:flex;align-items:center;justify-content:space-between}
header img{max-width:180px;max-height:80px;object-fit:contain}
.container{padding:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:25px 0}
.numero{font-size:34px;font-weight:bold;color:#93D500}
.item{border-bottom:1px solid #e5e7eb;padding:15px 0}
.botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.logo-preview{max-width:160px;max-height:70px;object-fit:contain}
@media(max-width:900px){.grid{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}}

.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:linear-gradient(135deg,#f3f4f6,#ffffff)}
.hero-card{max-width:760px;text-align:center;background:#fff;border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.08);padding:46px}
.hero-card img{max-width:260px;width:80%;border-radius:20px;margin-bottom:24px}
.hero-card h1{font-size:48px;margin-bottom:12px}
.hero-card p{font-size:20px;color:#4b5563;margin-bottom:24px}
</style>
</head>
<body>

<div id="paginaInstitucional" class="hero oculto">
  <div class="hero-card">
    <img src="./logo_conetfacility.png" alt="ConetFacility" onerror="this.style.display='none'">
    <h1>ConetFacility</h1>
    <p>Plataforma de gestão inteligente de manutenção para academias, equipamentos e serviços gerais.</p>
    <div class="botoes" style="justify-content:center">
      <button class="btn-verde" onclick="location.href='/admingeral.html'">Acessar Admin Geral</button>
    </div>
  </div>
</div>

<div id="loginArea" class="login oculto">
  <div class="login-card">
    <div id="logoLoginCliente"></div>
    <h1 id="tituloLogin">ConetFacility</h1>
    <p>Login administrativo do cliente</p>
    <label>Usuário</label>
    <input id="usuario" autocomplete="username">
    <label>Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <button class="btn-verde" onclick="fazerLogin()">Entrar</button>
    <p id="erroLogin" class="erro"></p>
  </div>
</div>

<div id="painel" class="oculto">
  <header>
    <div id="logoTopo"></div>
    <button class="btn-cinza" onclick="sair()">Sair</button>
  </header>
  <div class="container">
    <h1 id="nomeCliente">Painel Admin</h1>
    <p>Gerenciamento de equipamentos e chamados do cliente.</p>
    <div class="grid">
      <div class="card">
        <h2>Equipamentos</h2>
        <div id="listaEquipamentos">Carregando...</div>
      </div>
      <div class="card">
        <h2>Chamados</h2>
        <div id="listaChamados">Carregando...</div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://juwbkfhfmygduktuzqmu.supabase.co";
const SUPABASE_KEY="COLE_AQUI_SUPABASE_ANON_KEY";
const DOMINIO="https://sistema.conetfacility.com.br";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const academiaId=Number(params.get("academia_id")||0);
let academia=null,equipamentos=[],chamados=[];

function qrUrl(id){
  return `${DOMINIO}/equipamento.html?id=${Number(id)}&academia_id=${academiaId}`;
}

async function init(){
  if(!academiaId){
    document.getElementById("paginaInstitucional").classList.remove("oculto");
    return;
  }

  document.getElementById("loginArea").classList.remove("oculto");

  const a=await supabaseClient.from("academias").select("*").eq("id",academiaId).maybeSingle();
  academia=a.data;

  if(academia){
    document.getElementById("tituloLogin").innerText=academia.nome||"ConetFacility";
    document.getElementById("nomeCliente").innerText=academia.nome||"Painel Admin";

    if(academia.logo_url){
      document.getElementById("logoLoginCliente").innerHTML=`<img src="${academia.logo_url}" style="max-width:150px;display:block;margin:0 auto 18px">`;
      document.getElementById("logoTopo").innerHTML=`<img src="${academia.logo_url}">`;
    }else{
      document.getElementById("logoLoginCliente").innerHTML=`<img src="./logo_conetfacility.png" style="max-width:150px;display:block;margin:0 auto 18px">`;
      document.getElementById("logoTopo").innerHTML=`<img src="./logo_conetfacility.png">`;
    }
  }
}

async function fazerLogin(){
  const u=document.getElementById("usuario").value.trim();
  const s=document.getElementById("senha").value.trim();
  document.getElementById("erroLogin").innerText="";

  const r=await supabaseClient
    .from("usuarios_painel_cliente")
    .select("*")
    .eq("academia_id",academiaId)
    .eq("usuario",u)
    .eq("senha",s)
    .eq("status","ATIVO")
    .maybeSingle();

  if(r.error||!r.data){
    document.getElementById("erroLogin").innerText="Usuário ou senha inválidos.";
    return;
  }

  document.getElementById("loginArea").classList.add("oculto");
  document.getElementById("painel").classList.remove("oculto");
  carregarDados();
}

function sair(){
  document.getElementById("painel").classList.add("oculto");
  document.getElementById("loginArea").classList.remove("oculto");
  document.getElementById("usuario").value="";
  document.getElementById("senha").value="";
}

async function carregarDados(){
  const e=await supabaseClient.from("equipamentos").select("*").eq("academia_id",academiaId).order("id");
  equipamentos=e.data||[];

  const ids=equipamentos.map(x=>x.id);
  let c={data:[]};
  if(ids.length){
    c=await supabaseClient.from("chamados").select("*").in("equipamento_id",ids).order("id",{ascending:false});
  }
  chamados=c.data||[];
  render();
}

function render(){
  document.getElementById("listaEquipamentos").innerHTML=equipamentos.map(e=>`
    <div class="item">
      <h3>${e.nome||"Equipamento"}</h3>
      <p>${e.localizacao||""}</p>
      <p><strong>QR:</strong> <a target="_blank" href="${qrUrl(e.id)}">Abrir QR Code</a></p>
      <small>${qrUrl(e.id)}</small>
    </div>`).join("")||"<p>Nenhum equipamento.</p>";

  document.getElementById("listaChamados").innerHTML=chamados.map(c=>`
    <div class="item">
      <h3>Chamado #${c.id}</h3>
      <p><strong>Status:</strong> ${c.status||"-"}</p>
      <p>${c.descricao||""}</p>
    </div>`).join("")||"<p>Nenhum chamado.</p>";
}

init();
</script>
</body>
</html>
